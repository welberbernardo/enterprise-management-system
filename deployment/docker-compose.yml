version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${PROJECT_NAME:-enterprise}-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    image: ${PROJECT_NAME:-enterprise}-backend:latest
    container_name: ${PROJECT_NAME:-enterprise}-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:8080"
      HTTPS_PORT: "443"
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      JWT__Secret: ${JWT__Secret}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:?Set a strong bootstrap admin password}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Set the frontend origin}
      JWT__Issuer: ${JWT__Issuer}
      JWT__Audience: ${JWT__Audience}
      JWT__AccessTokenExpiryMinutes: ${JWT__AccessTokenExpiryMinutes:-60}
      JWT__RefreshTokenExpiryDays: ${JWT__RefreshTokenExpiryDays:-7}
      Serilog__WriteTo__0__Args__serverUrl: ${Serilog__WriteTo__0__Args__serverUrl:-http://localhost:5341}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - enterprise-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: ${PROJECT_NAME:-enterprise}-frontend:latest
    container_name: ${PROJECT_NAME:-enterprise}-frontend
    depends_on:
      - backend
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-enterprise}-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR:?Set an absolute path to your TLS certificate directory}:/etc/nginx/ssl:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

networks:
  enterprise-network:
    driver: bridge
    name: ${PROJECT_NAME:-enterprise}-network

volumes:
  sqlserver_data:
    name: ${PROJECT_NAME:-enterprise}-sqlserver-data
  backend_logs:
    name: ${PROJECT_NAME:-enterprise}-backend-logs
